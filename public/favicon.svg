<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- rounded square base, cream -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#fff5de" stroke="#0b1620" stroke-width="6"/>

  <!-- coral sunset sky stripe -->
  <rect x="10" y="10" width="108" height="60" fill="#ff7256" opacity="0.18"/>

  <!-- the sun, half-sunk on the horizon -->
  <circle cx="64" cy="72" r="26" fill="#ffd23f" stroke="#0b1620" stroke-width="5"/>
  <!-- horizon mask: cream rect over the lower half of the sun, then the wave goes over it -->
  <rect x="10" y="78" width="108" height="40" fill="#fff5de"/>

  <!-- back wave (teal, lighter), low -->
  <path d="M4 92
           C 20 84, 38 100, 62 90
           C 84 82, 102 102, 124 90
           L 124 124 L 4 124 Z"
        fill="#07c9b6" opacity="0.55"/>

  <!-- main wave (teal, bold) with crest -->
  <path d="M4 102
           C 18 92, 36 112, 56 100
           C 70 92, 80 88, 92 90
           C 104 92, 114 100, 124 96
           L 124 124 L 4 124 Z"
        fill="#07c9b6" stroke="#0b1620" stroke-width="5" stroke-linejoin="round"/>

  <!-- whitewater specks -->
  <circle cx="30" cy="104" r="2.6" fill="#fff5de"/>
  <circle cx="108" cy="106" r="2.2" fill="#fff5de"/>

  <!-- surfer silhouette on the wave crest -->
  <!-- board -->
  <ellipse cx="68" cy="92" rx="20" ry="3.2" fill="#0b1620"/>
  <!-- legs -->
  <path d="M62 92 L 60 80 L 64 80 L 66 90 Z" fill="#0b1620"/>
  <path d="M70 92 L 70 78 L 74 78 L 74 92 Z" fill="#0b1620"/>
  <!-- torso -->
  <path d="M60 80 C 60 72, 64 66, 70 66 C 76 66, 78 72, 76 80 Z" fill="#0b1620"/>
  <!-- head -->
  <circle cx="71" cy="60" r="5" fill="#0b1620"/>
  <!-- raised arm for balance -->
  <path d="M76 70 L 88 58 L 90 62 L 78 74 Z" fill="#0b1620"/>
</svg>
