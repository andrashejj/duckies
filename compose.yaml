services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_DB: duckies
      POSTGRES_USER: duckies
      POSTGRES_PASSWORD: duckies
    volumes:
      - duckies-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckies -d duckies"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  duckies-db:
